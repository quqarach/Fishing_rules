<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рыбалка: можно или нет?</title>

  <!-- MapLibre GL JS CSS -->
  <link href="https://unpkg.com/maplibre-gl@^5.0.0/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    :root {
      --c-surface: rgba(255, 255, 255, 0.92);
      --c-text: #1e293b;
      --c-text-muted: #64748b;
      --c-border: #e2e8f0;
      --c-border-soft: #f1f5f9;

      --c-ok: #22c55e;
      --c-ok-bg: #dcfce7;
      --c-ok-text: #166534;

      --c-warning: #eab308;
      --c-warning-bg: #fef9c3;
      --c-warning-text: #854d0e;

      --c-error: #ef4444;
      --c-error-bg: #fee2e2;
      --c-error-text: #991b1b;

      --c-info: #38bdf8;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-panel: 0 8px 32px rgba(15, 23, 42, 0.12);
      --shadow-popup: 0 12px 32px rgba(15, 23, 42, 0.18);
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 100%; height: 100%;
      overflow: hidden;
      color: var(--c-text);
      -webkit-font-smoothing: antialiased;
    }

    #map { width: 100%; height: 100vh; background: #eef2f6; }

    /* ---------- Боковая панель (стиль gdebenz) ---------- */
    .date-panel {
      position: fixed;
      top: 16px; right: 16px;
      width: 320px;
      max-height: calc(100vh - 96px);
      background: var(--c-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 16px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-panel);
      border: 1px solid rgba(15, 23, 42, 0.06);
      z-index: 1000;
      font-size: 13px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }
    .date-panel::-webkit-scrollbar { width: 6px; }
    .date-panel::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .date-panel::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--c-ok), var(--c-info));
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    .date-panel h4 {
      margin: 16px 0 8px 0;
      font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--c-text-muted);
    }

    .date-panel label {
      display: block; margin-bottom: 6px;
      font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--c-text-muted);
    }

    .date-panel input[type="date"] {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--c-border); border-radius: 10px;
      font-size: 13px; font-family: inherit;
      background: #f8fafc; color: var(--c-text);
      transition: border-color .15s, box-shadow .15s;
    }
    .date-panel input[type="date"]:focus {
      outline: none; border-color: var(--c-ok);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
    }

    #restrictions-list {
      max-height: 55vh; overflow-y: auto; margin-top: 4px; padding-right: 2px;
    }

    .restriction-item {
      border-radius: 10px; border: 1px solid var(--c-border);
      overflow: hidden; margin-bottom: 8px; background: #fff;
      transition: box-shadow .15s;
    }
    .restriction-item:hover { box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06); }

    .restriction-title {
      padding: 10px 12px; font-size: 12px; font-weight: 600;
      color: var(--c-text); background: #f8fafc;
      border-left: 3px solid var(--c-error);
      cursor: pointer; transition: background .15s; line-height: 1.35;
    }
    .restriction-title:hover { background: #f1f5f9; }

    .restriction-content {
      padding: 10px 12px; background: #fff;
      border-top: 1px solid var(--c-border-soft);
      display: none; font-size: 12px; line-height: 1.5;
      color: #475569; white-space: pre-line;
    }

    .attribution-osm {
      margin-top: 12px; font-size: 11px; color: var(--c-text-muted);
      border-top: 1px solid var(--c-border-soft); padding-top: 8px;
      text-align: center;
    }
    .attribution-osm a { color: var(--c-info); text-decoration: none; }

    /* ---------- Нижний баннер ---------- */
    .legal-banner {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #e2e8f0; padding: 8px 16px; text-align: center;
      font-size: 11px; z-index: 1000; line-height: 1.5;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* ---------- Попап MapLibre ---------- */
    .maplibregl-popup-content {
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-popup);
      padding: 14px 16px;
      font-size: 13px; line-height: 1.55;
      color: var(--c-text);
      border: 1px solid rgba(15, 23, 42, 0.06);
      min-width: 220px;
    }
    .maplibregl-popup-close-button {
      color: #94a3b8; font-size: 20px; padding: 6px 10px 0 0;
    }
    .maplibregl-popup-close-button:hover { color: #475569; }

    .popup-info strong { font-weight: 600; color: #0f172a; }
    .popup-info .row {
      display: flex; justify-content: space-between; gap: 12px;
      margin: 3px 0; font-size: 12px; color: var(--c-text-muted);
    }
    .popup-info .row b { color: #0f172a; font-weight: 600; text-align: right; }
    .popup-info .status {
      display: inline-block; padding: 5px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 700; margin: 8px 0 4px 0;
    }
    .popup-info .status.ok { background: var(--c-ok-bg); color: var(--c-ok-text); }
    .popup-info .status.error { background: var(--c-error-bg); color: var(--c-error-text); }
    .popup-info .status.warning { background: var(--c-warning-bg); color: var(--c-warning-text); }
    .popup-info .reason {
      margin-top: 8px; padding: 8px 10px; background: #f8fafc;
      border-left: 3px solid var(--c-error); border-radius: 0 6px 6px 0;
      font-size: 11.5px; color: #475569; line-height: 1.5; white-space: pre-line;
    }
    .popup-info .divider { height: 1px; background: var(--c-border-soft); margin: 10px 0; }

    /* ---------- Кастомный маркер ---------- */
    .custom-marker {
      width: 32px; height: 32px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.25);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .custom-marker span {
      transform: rotate(45deg);
      color: #fff; font-size: 14px; font-weight: 800; line-height: 1;
    }

    /* ---------- Мобильная адаптация ---------- */
    @media (max-width: 720px) {
      .date-panel {
        top: 8px; right: 8px; left: 8px; width: auto;
        max-height: 55vh; padding: 12px;
      }
      .legal-banner { font-size: 10px; padding: 6px 10px; }
    }
  </style>
</head>
<body>

  <div class="date-panel">
    <label for="fishing-date">Дата</label>
    <input type="date" id="fishing-date" />

    <h4>Действующие правила</h4>
    <div id="restrictions-list">
      <p style="color: #94a3b8; font-size: 12px; text-align: center; margin: 8px 0;">Загрузка правил…</p>
    </div>

    <div class="attribution-osm">
      © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> · OpenFreeMap
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@^5.0.0/dist/maplibre-gl.js"></script>

  <script>
    // =====================================================================
    // 1. КАРТА (MapLibre + OpenFreeMap Liberty)
    // =====================================================================
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [40.5, 46.5],   // Донбасс — в MapLibre [lng, lat]
      zoom: 7,
      attributionControl: false
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-left');

    map.on('error', (e) => {
      console.error('[MapLibre]', e?.error || e);
    });

    // =====================================================================
    // 2. УДАЛЕНИЕ ГРАНИЦ + РУССКИЕ ПОДПИСИ
    // =====================================================================
    map.on('load', () => {
      // --- Удаляем все слои с границами ---
      const style = map.getStyle();
      if (style && style.layers) {
        style.layers
          .filter(l => l.id.startsWith('boundary_') || l.id.includes('boundary'))
          .forEach(l => {
            try { map.removeLayer(l.id); } catch (err) {}
          });
      }

      // --- Русские подписи: name:ru с fallback на name ---
      const newStyle = map.getStyle();
      if (newStyle && newStyle.layers) {
        newStyle.layers.forEach(layer => {
          if (!layer.layout || !layer.layout['text-field']) return;
          const tfStr = JSON.stringify(layer.layout['text-field']);
          if (!tfStr.includes('"name"') && !tfStr.includes("'name'")) return;
          if (tfStr.includes('name:ru')) return;
          try {
            map.setLayoutProperty(layer.id, 'text-field', [
              'coalesce',
              ['get', 'name:ru'],
              ['get', 'name']
            ]);
          } catch (err) {}
        });
      }
    });

    // =====================================================================
    // 3. СОСТОЯНИЕ
    // =====================================================================
    let generalRules = [];
    let zonesGeoJson = { type: 'FeatureCollection', features: [] };
    let currentDate = new Date();
    let marker = null;

    // =====================================================================
    // 4. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // =====================================================================
    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function isDateInRange(target, startStr, endStr) {
      const start = new Date(startStr);
      const end = new Date(endStr);
      const t = new Date(target);
      t.setHours(0,0,0,0);
      start.setHours(0,0,0,0);
      end.setHours(0,0,0,0);
      return t >= start && t <= end;
    }

    // [lat, lng] -> [lng, lat]
    function swap(c) { return [c[1], c[0]]; }

    function coordsPolygon(coords)  { return coords.map(ring => ring.map(swap)); }
    function coordsLine(coords)     { return coords.map(swap); }
    function coordsMultiLine(brs)   { return brs.map(b => b.map(swap)); }

    // ---- Точка внутри полигона (GeoJSON: [lng, lat]) ----
    function pointInPolygon(lat, lng, polygonCoords) {
      let inside = false;
      const ring = polygonCoords[0];
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1];
        const xj = ring[j][0], yj = ring[j][1];
        const intersect = ((yi > lat) !== (yj > lat)) &&
          (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    // ---- Расстояние между двумя точками в МЕТРАХ (формула гаверсинуса) ----
    function distanceMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) ** 2 +
                Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    // ---- Точка рядом с линией. toleranceM — допуск в МЕТРАХ ----
    function isPointNearLine(lat, lng, lineCoords, toleranceM = 100) {
      for (let i = 0; i < lineCoords.length - 1; i++) {
        const [x1, y1] = lineCoords[i];     // [lng, lat]
        const [x2, y2] = lineCoords[i + 1];

        const dx = x2 - x1, dy = y2 - y1;
        const d2 = dx*dx + dy*dy;
        if (d2 === 0) {
          if (distanceMeters(lat, lng, y1, x1) <= toleranceM) return true;
          continue;
        }
        let t = ((lng - x1) * dx + (lat - y1) * dy) / d2;
        t = Math.max(0, Math.min(1, t));
        const px = x1 + t * dx;
        const py = y1 + t * dy;

        if (distanceMeters(lat, lng, py, px) <= toleranceM) return true;
      }
      return false;
    }

    // ---- Для рек допуск шире — 300 м ----
    function isNearAnyBranch(lat, lng, branches, toleranceM = 300) {
      return branches.some(b => isPointNearLine(lat, lng, b, toleranceM));
    }

    // =====================================================================
    // 5. ЗАГРУЗКА ДАННЫХ
    // =====================================================================
    async function loadZones() {
      try {
        const res = await fetch('rules-zones.json');
        if (!res.ok) throw new Error(`Не удалось загрузить rules-zones.json: ${res.status}`);
        const data = await res.json();

        generalRules = data.general_rules || [];

        const features = [];
        (data.local_zones || []).forEach((zone, idx) => {
          let geometry;
          if (zone.type === 'polygon') {
            geometry = { type: 'Polygon', coordinates: coordsPolygon(zone.coords) };
          } else if (zone.type === 'line') {
            geometry = { type: 'LineString', coordinates: coordsLine(zone.coords) };
          } else if (zone.type === 'river' && Array.isArray(zone.branches)) {
            geometry = { type: 'MultiLineString', coordinates: coordsMultiLine(zone.branches) };
          } else {
            return;
          }

          features.push({
            type: 'Feature',
            id: idx,
            properties: {
              name: zone.name,
              rule: zone.rule,
              start: zone.start,
              end: zone.end,
              ruleType: zone.ruleType || 'full',
              zoneType: zone.type,
              // Допуск в метрах: для рек 300, для линий 150. Можно переопределить в JSON.
              toleranceM: zone.toleranceM || (zone.type === 'river' ? 300 : 150)
            },
            geometry
          });
        });

        zonesGeoJson = { type: 'FeatureCollection', features };

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('fishing-date').value = today;
        currentDate = new Date(today);

        if (map.isStyleLoaded()) {
          buildZoneLayers();
          refreshZones();
        } else {
          map.once('load', () => {
            buildZoneLayers();
            refreshZones();
          });
        }
        updateGeneralRules(currentDate);
      } catch (e) {
        console.error('Ошибка загрузки:', e);
        document.getElementById('restrictions-list').innerHTML =
          `<p style="color:#ef4444;font-size:12px;">Ошибка: ${e.message}</p>`;
      }
    }

    // =====================================================================
    // 6. СЛОИ ЗОН
    // =====================================================================
    const SRC = 'zones';
    const FILL = 'zones-fill';
    const LINE = 'zones-line';

    function buildZoneLayers() {
      if (!map.getSource(SRC)) {
        map.addSource(SRC, { type: 'geojson', data: zonesGeoJson });
      }
      if (!map.getLayer(FILL)) {
        map.addLayer({
          id: FILL, type: 'fill', source: SRC,
          filter: ['==', ['geometry-type'], 'Polygon'],
          paint: {
            'fill-color': '#22c55e',
            'fill-opacity': 0.12
          }
        });
      }
      if (!map.getLayer(LINE)) {
        map.addLayer({
          id: LINE, type: 'line', source: SRC,
          paint: {
            'line-color': '#22c55e',
            'line-width': 3,
            'line-opacity': 0.85
          }
        });
      }
    }

    // ---- Пересчёт состояний и применение стилей ----
    function refreshZones() {
      if (!map.getSource(SRC)) return;

      const date = currentDate;

      const features = zonesGeoJson.features.map(f => {
        const p = f.properties;
        const active = isDateInRange(date, p.start, p.end);
        let state = 'none';

        if (active) {
          const nameLower = (p.name || '').toLowerCase();
          const globalKoysugFull = generalRules.some(gr =>
            gr.appliesEverywhere &&
            gr.ruleType === 'full' &&
            isDateInRange(date, gr.start, gr.end) &&
            (
              gr.name.toLowerCase().includes('р. койсуг') ||
              gr.name.toLowerCase().includes('река койсуг') ||
              nameLower.includes('р. койсуг') ||
              nameLower.includes('река койсуг')
            )
          );

          if (globalKoysugFull) {
            state = 'hidden';
          } else {
            const rule = generalRules.find(r => r.name === p.name);
            const rt = p.ruleType || rule?.type || 'full';
            state = rt === 'partial' ? 'partial' : 'full';
          }
        }

        return { ...f, properties: { ...p, state } };
      });

      map.getSource(SRC).setData({ type: 'FeatureCollection', features });

      // ---- Expressions для paint ----
      // Неактивные (none) — заметный зелёный, чтобы реки и полигоны читались
      const fillColor = ['match', ['get','state'],
        'none',    '#22c55e',
        'partial', '#eab308',
        'full',    '#ef4444',
        'hidden',  'transparent',
        '#22c55e'
      ];
      const fillOpacity = ['match', ['get','state'],
        'none',    0.12,
        'partial', 0.20,
        'full',    0.22,
        'hidden',  0,
        0.12
      ];
      const lineColor = ['match', ['get','state'],
        'none',    '#22c55e',
        'partial', '#eab308',
        'full',    '#ef4444',
        'hidden',  'transparent',
        '#22c55e'
      ];
      const lineWidth = ['match', ['get','state'],
        'none',    3,
        'partial', 4,
        'full',    4,
        'hidden',  0,
        3
      ];
      const lineOpacity = ['match', ['get','state'],
        'none',    0.85,
        'partial', 0.95,
        'full',    0.95,
        'hidden',  0,
        0.85
      ];

      map.setPaintProperty(FILL, 'fill-color', fillColor);
      map.setPaintProperty(FILL, 'fill-opacity', fillOpacity);
      map.setPaintProperty(LINE, 'line-color', lineColor);
      map.setPaintProperty(LINE, 'line-width', lineWidth);
      map.setPaintProperty(LINE, 'line-opacity', lineOpacity);
    }

    // =====================================================================
    // 7. СПИСОК ОБЩИХ ПРАВИЛ
    // =====================================================================
    function updateGeneralRules(date) {
      const box = document.getElementById('restrictions-list');
      box.innerHTML = '';

      const active = generalRules.filter(r => isDateInRange(date, r.start, r.end));
      if (active.length === 0) {
        box.innerHTML = '<p style="color:#94a3b8;font-size:12px;text-align:center;margin:8px 0;">Нет действующих общих правил</p>';
        return;
      }

      active.forEach(rule => {
        const item = document.createElement('div');
        item.className = 'restriction-item';

        const title = document.createElement('div');
        title.className = 'restriction-title';
        title.textContent = rule.name;

        const content = document.createElement('div');
        content.className = 'restriction-content';
        content.textContent = rule.rule;
        content.style.display = 'none';

        title.onclick = () => {
          content.style.display = content.style.display === 'block' ? 'none' : 'block';
        };

        item.appendChild(title);
        item.appendChild(content);
        box.appendChild(item);
      });
    }

    // =====================================================================
    // 8. КАСТОМНЫЙ МАРКЕР
    // =====================================================================
    function createStatusMarkerEl(statusClass) {
      const colors = { ok: '#22c55e', warning: '#eab308', error: '#ef4444' };
      const icons  = { ok: '✓', warning: '!', error: '✕' };
      const el = document.createElement('div');
      el.className = 'custom-marker';
      el.style.background = colors[statusClass] || '#38bdf8';
      el.innerHTML = `<span>${icons[statusClass] || '?'}</span>`;
      return el;
    }

    // =====================================================================
    // 9. КЛИК ПО КАРТЕ
    // =====================================================================
    map.on('click', (e) => {
      const { lat, lng } = e.lngLat;
      const dateStr = document.getElementById('fishing-date').value;
      const date = new Date(dateStr);

      let locationName = null;
      const fullRestrictions = [];
      const partialRestrictions = [];

      // ---- Локальные зоны ----
      zonesGeoJson.features.forEach(f => {
        const p = f.properties;
        if (!isDateInRange(date, p.start, p.end)) return;

        const tol = p.toleranceM || 150;
        let inside = false;

        if (f.geometry.type === 'Polygon') {
          inside = pointInPolygon(lat, lng, f.geometry.coordinates);
        } else if (f.geometry.type === 'LineString') {
          inside = isPointNearLine(lat, lng, f.geometry.coordinates, tol);
        } else if (f.geometry.type === 'MultiLineString') {
          inside = isNearAnyBranch(lat, lng, f.geometry.coordinates, tol);
        }
        if (!inside) return;

        locationName = p.name;
        const rule = generalRules.find(r => r.name === p.name);
        const rt = p.ruleType || rule?.type || 'full';
        if (rt === 'partial') {
          partialRestrictions.push(rule?.rule || p.rule);
        } else {
          fullRestrictions.push(p.rule);
        }
      });

      // ---- Глобальные правила ----
      generalRules.forEach(rule => {
        if (rule.appliesEverywhere && isDateInRange(date, rule.start, rule.end)) {
          if (rule.type === 'partial') partialRestrictions.push(rule.rule);
          else fullRestrictions.push(rule.rule);
        }
      });

      let status, statusClass;
      if (fullRestrictions.length > 0) {
        status = '❌ Рыбалка запрещена'; statusClass = 'error';
      } else if (partialRestrictions.length > 0) {
        status = '⚠️ Разрешена с ограничениями'; statusClass = 'warning';
      } else {
        status = '✅ Рыбалка разрешена'; statusClass = 'ok';
      }

      const reasons = [...fullRestrictions, ...partialRestrictions]
        .map(r => `<div class="reason">${r}</div>`).join('');

      if (marker) marker.remove();

      const popupEl = document.createElement('div');
      popupEl.className = 'popup-info';
      popupEl.innerHTML = `
        ${locationName ? `<strong>${locationName}</strong><div class="divider"></div>` : ''}
        <div class="row"><span>Дата</span><b>${formatDate(dateStr)}</b></div>
        <div class="row"><span>Координаты</span><b>${lat.toFixed(5)}, ${lng.toFixed(5)}</b></div>
        <div class="status ${statusClass}">${status}</div>
        ${reasons}
      `;

      const el = createStatusMarkerEl(statusClass);
      marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
        .setLngLat([lng, lat])
        .setPopup(new maplibregl.Popup({ offset: 24 }).setDOMContent(popupEl))
        .addTo(map);

      marker.togglePopup();
    });

    // =====================================================================
    // 10. СМЕНА ДАТЫ
    // =====================================================================
    document.getElementById('fishing-date').addEventListener('change', function () {
      currentDate = new Date(this.value);
      refreshZones();
      updateGeneralRules(currentDate);
    });

    // =====================================================================
    // 11. СТАРТ
    // =====================================================================
    loadZones();
  </script>
