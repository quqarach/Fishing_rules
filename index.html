<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рыбалка: можно или нет?</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts (Inter для современного вида) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* === БАЗОВЫЕ СТИЛИ (как в GdeBenz) === */
        :root {
            --primary-color: #2563eb;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --bg-panel: #ffffff;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            background-color: #f3f4f6;
            overflow: hidden; /* Предотвращаем скролл страницы, скроллим только панель */
        }

        /* === КАРТА === */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Убираем стандартный атрибут Leaflet вниз, чтобы не мешал */
        .leaflet-control-attribution {
            font-size: 10px !important;
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(4px);
        }

        /* === ПЛАВАЮЩАЯ ПАНЕЛЬ (Sidebar) === */
        .sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 380px;
            max-height: calc(100vh - 40px);
            background: var(--bg-panel);
            border-radius: var(--radius);
            box-shadow: var(--shadow-soft);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-picker-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .date-picker-container label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .date-picker-container input {
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .date-picker-container input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* === СПИСОК ПРАВИЛ === */
        .rules-list {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
        }

        .rules-list::-webkit-scrollbar {
            width: 6px;
        }
        .rules-list::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 3px;
        }

        .rule-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .rule-card:hover {
            border-color: var(--primary-color);
            background: #eff6ff;
        }

        .rule-card.active-zone {
            border-left: 4px solid var(--danger-color);
            background: #fef2f2;
            border-color: #fecaca;
        }

        .rule-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .rule-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
        }

        .rule-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 20px;
            white-space: nowrap;
            margin-left: 8px;
        }

        .badge-restricted {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-allowed {
            background: #d1fae5;
            color: #065f46;
        }

        .rule-dates {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .rule-text {
            font-size: 13px;
            color: #4b5563;
            line-height: 1.5;
            white-space: pre-wrap; /* Сохраняем переносы строк из JSON */
        }

        /* === ЛЕГЕНДА (справа внизу) === */
        .legend {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: var(--bg-panel);
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: var(--shadow-soft);
            z-index: 1000;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .legend-item:last-child { margin-bottom: 0; }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* === МОБИЛЬНАЯ АДАПТАЦИЯ === */
        @media (max-width: 768px) {
            .sidebar {
                top: auto;
                bottom: 0;
                left: 0;
                width: 100%;
                max-height: 60vh;
                border-radius: 20px 20px 0 0;
                box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            }
            .legend {
                bottom: 62vh; /* Поднимаем легенду над панелью */
                right: 10px;
                font-size: 12px;
                padding: 8px 12px;
            }
        }
        
        /* Скрываем панель "Загрузка" по умолчанию */
        .loading-overlay {
            display: none; 
        }
    </style>
</head>
<body>

    <!-- Карта -->
    <div id="map"></div>

    <!-- Плавающая панель управления -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>🎣 Правила рыболовства</h1>
            <div class="date-picker-container">
                <label for="fishing-date">Выберите дату рыбалки:</label>
                <input type="date" id="fishing-date">
            </div>
        </div>
        
        <div class="rules-list" id="rules-list">
            <div style="text-align: center; color: var(--text-secondary); padding: 20px;">
                Загрузка правил...
            </div>
        </div>
    </div>

    <!-- Легенда -->
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background: rgba(239, 68, 68, 0.2); border-color: #ef4444;"></div>
            <span>Запретная зона / Ограничение</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: rgba(16, 185, 129, 0.2); border-color: #10b981;"></div>
            <span>Разрешенный вылов</span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Инициализация карты (Координаты центра Азово-Черноморского бассейна)
        const map = L.map('map', {
            zoomControl: false // Переместим зум позже, если нужно, или оставим стандартным
        }).setView([47.2, 39.7], 9);

        // Добавляем контрол зума в правый нижний угол, как в современных приложениях
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 2. СТИЛЬ КАРТЫ (Как в GdeBenz - чистый CartoDB Voyager)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // 3. Установка текущей даты в инпут
        const dateInput = document.getElementById('fishing-date');
        dateInput.valueAsDate = new Date();

        // Хранилище для слоев карты, чтобы управлять их видимостью
        let mapLayers = [];

        // 4. Функция проверки, попадает ли дата в интервал
        function isDateInRange(checkDate, startDate, endDate) {
            const check = new Date(checkDate).getTime();
            const start = new Date(startDate).getTime();
            const end = new Date(endDate).getTime();
            return check >= start && check <= end;
        }

        // 5. Загрузка и отрисовка данных
        async function loadData() {
            try {
                // Загружаем ваш JSON файл
                const response = await fetch('rules-zones.json');
                const data = await response.json();
                
                renderRules(data);
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                document.getElementById('rules-list').innerHTML = 
                    '<div style="color: red; padding: 20px; text-align: center;">Ошибка загрузки rules-zones.json. Убедитесь, что файл лежит рядом с index.html и вы используете локальный сервер (например, Live Server в VS Code).</div>';
            }
        }

        // 6. Отрисовка списка и слоев на карте
        function renderRules(data) {
            const listContainer = document.getElementById('rules-list');
            listContainer.innerHTML = ''; // Очистка
            
            // Очищаем старые слои с карты
            mapLayers.forEach(layer => map.removeLayer(layer));
            mapLayers = [];

            const currentDate = dateInput.value;

            // Объединяем общие правила и локальные зоны для отображения в списке
            const allRules = [
                ...data.general_rules.map(r => ({...r, type: 'general'})),
                ...data.local_zones.map(z => ({...z, type: 'zone'}))
            ];

            allRules.forEach((rule, index) => {
                const isActive = isDateInRange(currentDate, rule.start, rule.end);
                
                // Создаем карточку в боковой панели
                const card = document.createElement('div');
                card.className = `rule-card ${isActive ? 'active-zone' : ''}`;
                
                const badgeClass = isActive ? 'badge-restricted' : 'badge-allowed';
                const badgeText = isActive ? 'Действует' : 'Не активно';

                card.innerHTML = `
                    <div class="rule-card-header">
                        <div class="rule-name">${rule.name}</div>
                        <span class="rule-badge ${badgeClass}">${badgeText}</span>
                    </div>
                    <div class="rule-dates">
                        📅 ${new Date(rule.start).toLocaleDateString('ru-RU')} – ${new Date(rule.end).toLocaleDateString('ru-RU')}
                    </div>
                    <div class="rule-text">${rule.rule}</div>
                `;

                // Интерактивность: при наведении на карточку подсвечиваем зону на карте
                card.addEventListener('mouseenter', () => {
                    if (rule.layer) {
                        rule.layer.setStyle({ weight: 4, fillOpacity: 0.4 });
                        rule.layer.bringToFront();
                    }
                });
                card.addEventListener('mouseleave', () => {
                    if (rule.layer) {
                        rule.layer.setStyle({ weight: 2, fillOpacity: 0.2 });
                    }
                });
                
                // Клик по карточке центрирует карту на зоне
                card.addEventListener('click', () => {
                    if (rule.layer) {
                        map.fitBounds(rule.layer.getBounds(), { padding: [50, 50] });
                    }
                });

                listContainer.appendChild(card);

                // 7. Отрисовка на карте (только для зон с координатами)
                if (rule.type === 'zone' && rule.coords) {
                    let layer;
                    
                    // Определяем стиль: красный для запретов, зеленый для разрешений (по умолчанию красный, т.к. это правила ограничений)
                    const style = {
                        color: isActive ? '#ef4444' : '#d1d5db',
                        weight: 2,
                        opacity: 0.8,
                        fillColor: isActive ? '#ef4444' : '#d1d5db',
                        fillOpacity: isActive ? 0.2 : 0.05,
                        dashArray: isActive ? null : '5, 5'
                    };

                    if (rule.type_geom === 'line' || rule.name.toLowerCase().includes('р.')) {
                        // Если это линия (река)
                        layer = L.polyline(rule.coords, style);
                    } else {
                        // Если это полигон (зона)
                        // Leaflet ожидает массив массивов для полигонов. Проверяем структуру JSON.
                        // В вашем JSON coords иногда [[[lat, lon]]], иногда [[lat, lon]]. Приведем к стандарту Leaflet.
                        const coords = rule.coords.length > 0 && Array.isArray(rule.coords[0][0]) ? rule.coords : [rule.coords];
                        layer = L.polygon(coords, style);
                    }

                    // Добавляем попап при клике на зону
                    layer.bindPopup(`
                        <div style="font-family: Inter, sans-serif; min-width: 200px;">
                            <strong style="font-size: 14px; display: block; margin-bottom: 6px;">${rule.name}</strong>
                            <span style="font-size: 12px; color: ${isActive ? '#ef4444' : '#10b981'}; font-weight: 600;">
                                ${isActive ? '⚠️ Ограничение действует' : '✅ Ограничение не действует'}
                            </span>
                        </div>
                    `);

                    layer.addTo(map);
                    rule.layer = layer; // Сохраняем ссылку на слой для интерактивности
                    mapLayers.push(layer);
                }
            });
        }

        // 8. Реакция на изменение даты
        dateInput.addEventListener('change', () => {
            renderRules(window.currentData); // Перерисовываем с новой датой
        });

        // Запуск
        // Сохраняем данные глобально, чтобы перерисовывать при смене даты без повторного fetch
        fetch('rules-zones.json')
            .then(res => res.json())
            .then(data => {
                window.currentData = data;
                renderRules(data);
            })
            .catch(err => console.error("Не удалось загрузить JSON. Запускайте через локальный сервер (Live Server).", err));

    </script>
</body>
</html>
